<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="sq"><rect x="8" y="8" width="240" height="240" rx="30"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0a0f1c"/><stop offset="1" stop-color="#0c0a1e"/>
    </linearGradient>
    <linearGradient id="cyan" x1="40" y1="110" x2="110" y2="185" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5cffe6"/><stop offset="1" stop-color="#38a9ff"/>
    </linearGradient>
    <linearGradient id="hg" x1="120" y1="100" x2="180" y2="190" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5cffe6"/><stop offset="0.55" stop-color="#43a6ff"/><stop offset="1" stop-color="#c86bff"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="8" y="8" width="240" height="240" rx="30" fill="url(#bg)" stroke="#243356" stroke-width="2"/>

  <g clip-path="url(#sq)">
    <g stroke="#5cffe6" stroke-width="2" opacity="0.05"><path d="M8 96 H248 M8 120 H248 M8 144 H248 M8 168 H248 M8 192 H248"/></g>
    <!-- 终端窗口三点 + 标题栏 -->
    <circle cx="44" cy="44" r="7" fill="#38f9d7"/><circle cx="68" cy="44" r="7" fill="#43a6ff"/><circle cx="92" cy="44" r="7" fill="#c86bff"/>
    <line x1="8" y1="66" x2="248" y2="66" stroke="#243356" stroke-width="1.5"/>

    <!-- 命令行: > H _ -->
    <polyline points="44,112 88,150 44,188" fill="none" stroke="url(#cyan)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
    <text x="150" y="186" text-anchor="middle" font-family="Consolas,'Courier New',monospace" font-size="128" font-weight="800" fill="url(#hg)" filter="url(#glow)">H</text>
    <rect x="192" y="170" width="40" height="16" rx="3" fill="#38f9d7" filter="url(#glow)"/>
  </g>
</svg>
