<svg width="920" height="260" viewBox="0 0 920 260" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Holha1337 - WinUtil 中文汉化 首席维护者">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="920" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0a0e1a"/>
      <stop offset="0.55" stop-color="#0d1b2e"/>
      <stop offset="1" stop-color="#131033"/>
    </linearGradient>
    <linearGradient id="ink" x1="120" y1="90" x2="800" y2="170" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38f9d7"/>
      <stop offset="0.5" stop-color="#43a6ff"/>
      <stop offset="1" stop-color="#c86bff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38f9d7"/>
      <stop offset="1" stop-color="#c86bff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="1" y="1" width="918" height="258" rx="22" fill="url(#bg)" stroke="#2a3a5c" stroke-width="1.5"/>

  <!-- 电路网格底纹 -->
  <g stroke="#1b2b47" stroke-width="1" opacity="0.55">
    <path d="M0 64 H920 M0 128 H920 M0 192 H920"/>
    <path d="M180 0 V260 M360 0 V260 M540 0 V260 M720 0 V260"/>
  </g>
  <g fill="#38f9d7" opacity="0.5">
    <circle cx="180" cy="64" r="2.6"/><circle cx="540" cy="192" r="2.6"/>
    <circle cx="720" cy="128" r="2.6"/><circle cx="360" cy="128" r="2.6"/>
  </g>

  <!-- 左侧霓虹强调条 -->
  <rect x="34" y="46" width="8" height="168" rx="4" fill="url(#accent)" filter="url(#glow)"/>

  <!-- 主名 -->
  <text x="70" y="126" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="76" font-weight="800" letter-spacing="1" fill="url(#ink)" filter="url(#glow)">Holha<tspan font-family="'Consolas','Courier New',monospace" fill="#38f9d7">1337</tspan></text>

  <!-- 副标题 -->
  <text x="72" y="176" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="27" font-weight="600" fill="#cfe3ff">WinUtil 中文汉化 · 首席维护者</text>

  <!-- 署名药丸标签 -->
  <g>
    <rect x="72" y="196" width="196" height="34" rx="17" fill="#132743" stroke="#38f9d7" stroke-width="1.4"/>
    <text x="170" y="219" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="3" fill="#38f9d7">汉 化 作 者</text>
  </g>
  <g>
    <rect x="280" y="196" width="150" height="34" rx="17" fill="#241338" stroke="#c86bff" stroke-width="1.4"/>
    <text x="355" y="219" text-anchor="middle" font-family="'Consolas',monospace" font-size="15" font-weight="700" letter-spacing="2" fill="#d9a6ff">MAINTAINER</text>
  </g>

  <!-- 右侧徽记 -->
  <g transform="translate(788,130)" filter="url(#glow)">
    <path d="M0 -58 L50 -30 L50 30 L0 58 L-50 30 L-50 -30 Z" fill="#0e1c32" stroke="url(#accent)" stroke-width="2.5"/>
    <text x="0" y="14" text-anchor="middle" font-family="'Consolas','Courier New',monospace" font-size="40" font-weight="800" fill="url(#ink)">H</text>
  </g>
</svg>
