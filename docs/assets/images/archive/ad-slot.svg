<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 180" width="820" height="180" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif">
  <defs>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38F9D7"/>
      <stop offset="0.5" stop-color="#43A6FF"/>
      <stop offset="1" stop-color="#C86BFF"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0E1A"/>
      <stop offset="1" stop-color="#0B1730"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- 背景板 + 霓虹描边 -->
  <rect x="6" y="6" width="808" height="168" rx="18" fill="url(#bg)" stroke="url(#neon)" stroke-width="2.5"/>
  <!-- 虚线内框:暗示"空位/待投放" -->
  <rect x="26" y="26" width="768" height="128" rx="12" fill="none" stroke="url(#neon)" stroke-width="1.2" stroke-dasharray="7 8" opacity="0.5"/>

  <!-- 左侧终端 >_ 徽记 -->
  <g transform="translate(74,90)" filter="url(#glow)">
    <text x="0" y="14" font-family="Consolas,'Courier New',monospace" font-size="52" font-weight="bold" fill="url(#neon)" text-anchor="middle">&gt;_</text>
  </g>

  <!-- 主文案 -->
  <text x="150" y="74" font-size="34" font-weight="700" fill="url(#neon)" filter="url(#glow)">推广位 · 虚位以待</text>
  <text x="152" y="110" font-size="17" fill="#9FB4D6">品牌合作 · 广告投放 · 工具联动 —— 触达每一位重装 Windows 的中国开发者</text>
  <text x="152" y="138" font-size="15" fill="#5E7BA6">联系 Holha1337 · github.com/yasewang1337-svg/winutil-cn</text>

  <!-- 右上角 AD 角标 -->
  <g transform="translate(724,30)">
    <rect x="0" y="0" width="62" height="26" rx="6" fill="none" stroke="url(#neon)" stroke-width="1.3"/>
    <text x="31" y="18" font-size="14" font-weight="700" fill="url(#neon)" text-anchor="middle" letter-spacing="2">AD</text>
  </g>
</svg>
