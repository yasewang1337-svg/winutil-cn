<svg width="940" height="340" viewBox="0 0 940 340" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Holha1337 — WinUtil 中文汉化 · 首席维护者。能为中国开发者提供更好的帮助，是我最开心的事情，未来会更好。">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="940" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0a0e1a"/>
      <stop offset="0.55" stop-color="#0d1b2e"/>
      <stop offset="1" stop-color="#131033"/>
    </linearGradient>
    <linearGradient id="ink" x1="120" y1="80" x2="800" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38f9d7"/>
      <stop offset="0.5" stop-color="#43a6ff"/>
      <stop offset="1" stop-color="#c86bff"/>
    </linearGradient>
    <linearGradient id="slogan" x1="90" y1="0" x2="850" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7ffbe4"/>
      <stop offset="0.5" stop-color="#8cc6ff"/>
      <stop offset="1" stop-color="#e0b3ff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38f9d7"/>
      <stop offset="1" stop-color="#c86bff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="1" y="1" width="938" height="338" rx="24" fill="url(#bg)" stroke="#2a3a5c" stroke-width="1.5"/>

  <!-- 电路网格底纹 -->
  <g stroke="#1b2b47" stroke-width="1" opacity="0.5">
    <path d="M0 64 H940 M0 128 H940 M0 192 H940"/>
    <path d="M188 0 V250 M376 0 V250 M564 0 V250 M752 0 V250"/>
  </g>
  <g fill="#38f9d7" opacity="0.5">
    <circle cx="188" cy="64" r="2.6"/><circle cx="564" cy="192" r="2.6"/>
    <circle cx="752" cy="128" r="2.6"/><circle cx="376" cy="128" r="2.6"/>
  </g>

  <!-- 左侧霓虹强调条 -->
  <rect x="34" y="42" width="8" height="164" rx="4" fill="url(#accent)" filter="url(#glow)"/>

  <!-- 主名 -->
  <text x="70" y="118" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="74" font-weight="800" letter-spacing="1" fill="url(#ink)" filter="url(#glow)">Holha<tspan font-family="'Consolas','Courier New',monospace" fill="#38f9d7">1337</tspan></text>

  <!-- 副标题 -->
  <text x="72" y="162" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="26" font-weight="600" fill="#cfe3ff">WinUtil 中文汉化 · 首席维护者</text>

  <!-- 署名药丸标签 -->
  <g>
    <rect x="72" y="182" width="192" height="34" rx="17" fill="#132743" stroke="#38f9d7" stroke-width="1.4"/>
    <text x="168" y="205" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="3" fill="#38f9d7">汉 化 作 者</text>
  </g>
  <g>
    <rect x="276" y="182" width="150" height="34" rx="17" fill="#241338" stroke="#c86bff" stroke-width="1.4"/>
    <text x="351" y="205" text-anchor="middle" font-family="'Consolas',monospace" font-size="15" font-weight="700" letter-spacing="2" fill="#d9a6ff">MAINTAINER</text>
  </g>

  <!-- 右侧徽记 -->
  <g transform="translate(818,116)" filter="url(#glow)">
    <path d="M0 -54 L47 -28 L47 28 L0 54 L-47 28 L-47 -28 Z" fill="#0e1c32" stroke="url(#accent)" stroke-width="2.5"/>
    <text x="0" y="13" text-anchor="middle" font-family="'Consolas','Courier New',monospace" font-size="38" font-weight="800" fill="url(#ink)">H</text>
  </g>

  <!-- Slogan 高亮带 -->
  <rect x="52" y="256" width="836" height="56" rx="14" fill="#10233d" stroke="#33507e" stroke-width="1.2"/>
  <rect x="52" y="256" width="6" height="56" rx="3" fill="url(#accent)"/>
  <text x="470" y="292" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue','PingFang SC','Microsoft YaHei',sans-serif" font-size="23" font-weight="600" fill="url(#slogan)">能为中国开发者提供更好的帮助，是我最开心的事情，未来会更好&#160;<tspan fill="#ff6b9d" font-size="22">&#9829;</tspan></text>
</svg>
