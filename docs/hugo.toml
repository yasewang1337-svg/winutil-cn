weight = 5

[[menu.main]]
name = "搜索"
weight = 6

  [menu.main.params]
  type = "search"

[[menu.main]]
name = "GitHub"
weight = 7
url = "https://github.com/yasewang1337-svg/winutil-cn"

  [menu.main.params]
  icon = "github"

[params]
description = "WinUtil CN 是面向中文用户的 Windows 11 软件管理与系统维护工具。先核对操作清单，再查看逐项结果；另提供 Windows 10 / 11 x64 镜像制作与默认只读的 MCP 接口。"
title = "WinUtil CN"
images = ["images/screenshots/home-cn.png"]
displayUpdatedDate = true
dateFormat = "2006 年 1 月 2 日"

  [params.navbar]
  displayTitle = true
  displayLogo = true

    [params.navbar.logo]
    path = "favicon.svg"
    dark = "favicon.svg"
    width = 30
    height = 30

  [params.theme]
  default = "system"
  displayToggle = true

  [params.page]
  width = "wide"

  [params.footer]
  enable = true
  displayCopyright = true
  displayPoweredBy = false
  width = "normal"

[params.highlight.copy]
enable = true
display = "hover"

[menu]

  [[menu.sidebar]]
  name = "项目链接"
  weight = 1
    [menu.sidebar.params]
    type = "separator"

  [[menu.sidebar]]
  name = "中文仓库 ↗"
  url = "https://github.com/yasewang1337-svg/winutil-cn"
  weight = 2

  [[menu.sidebar]]
  name = "上游项目 ↗"
  url = "https://github.com/ChrisTitusTech/winutil"
  weight = 3


[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
