baseURL = "https://yasewang1337-svg.github.io/winutil-cn/"
languageCode = "zh-cn"
defaultContentLanguage = "zh-cn"
title = "WinUtil CN"
enableGitInfo = true
canonifyURLs = false
enableRobotsTXT = true

[sitemap]
  changefreq = ""
  filename = "sitemap.xml"

[[module.mounts]]
  source = "assets"
  target = "assets"

[[module.imports]]
path = "github.com/imfing/hextra"

