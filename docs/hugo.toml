pageRef = "/mcp/"
weight = 2

[[menu.main]]
identifier = "documentation"
name = "开发文档"
weight = 3

[[menu.main]]
identifier = "contribution-guides"
name = "贡献指南"
pageRef = "/contributing/"
weight = 1
parent = "documentation"

[[menu.main]]
identifier = "developer-documentation"
name = "开发者参考"
pageRef = "/dev"
weight = 2
parent = "documentation"

[[menu.main]]
identifier = "help"
name = "帮助"
weight = 4

[[menu.main]]
identifier = "faq"
name = "常见问题"
