baseURL = "/"
languageCode = "zh-cn"
defaultContentLanguage = "zh-cn"
title = "WinUtil CN 中文文档"
enableGitInfo = true
canonifyURLs = false

[[module.mounts]]
  source = "assets"
  target = "assets"

[[module.imports]]
path = "github.com/imfing/hextra"

[[menu.main]]
identifier = "userguide"
name = "用户指南"
pageRef = "/userguide"
weight = 1

[[menu.main]]
identifier = "documentation"
name = "开发文档"
weight = 2

[[menu.main]]
identifier = "contribution-guides"
name = "贡献指南"
pageRef = "CONTRIBUTING.md"
weight = 1
parent = "documentation"

[[menu.main]]
identifier = "developer-documentation"
name = "开发者参考"
pageRef = "/dev"
weight = 2
parent = "documentation"

[[menu.main]]
identifier = "help"
name = "帮助"
weight = 3

[[menu.main]]
identifier = "faq"
name = "常见问题"
pageRef = "faq.md"
weight = 1
parent = "help"

[[menu.main]]
identifier = "known-issues"
name = "已知问题"
pageRef = "KnownIssues.md"
weight = 2
parent = "help"

[[menu.main]]
identifier = "forums"
name = "问题反馈"
url = "https://github.com/yasewang1337-svg/winutil-cn/issues"
weight = 3
parent = "help"

[[menu.main]]
name = "下载中文版"
url = "https://github.com/yasewang1337-svg/winutil-cn/releases/latest"
weight = 5

[[menu.main]]
name = "搜索"
weight = 6

  [menu.main.params]
  type = "search"

[[menu.main]]
name = "GitHub"
weight = 7
url = "https://github.com/yasewang1337-svg/winutil-cn"

  [menu.main.params]
  icon = "github"

[params]
description = "WinUtil CN 中文装机与维护助手：软件选择、操作结果与设置历史"
displayUpdatedDate = true
dateFormat = "January 2, 2006"

  [params.navbar]
  displayTitle = false
  displayLogo = true

    [params.navbar.logo]
    path = "navlogo.png"
    dark = "navlogo.png"
    link = "/"
    width = 150
    height = 50

  [params.theme]
  default = "system"
  displayToggle = true

  [params.page]
  width = "wide"

  [params.footer]
  enable = true
  displayCopyright = true
  displayPoweredBy = false
  width = "normal"

[params.highlight.copy]
enable = true
display = "hover"

[menu]

  [[menu.sidebar]]
  name = "项目链接"
  weight = 1
    [menu.sidebar.params]
    type = "separator"

  [[menu.sidebar]]
  name = "中文仓库 ↗"
  url = "https://github.com/yasewang1337-svg/winutil-cn"
  weight = 2

  [[menu.sidebar]]
  name = "上游项目 ↗"
  url = "https://github.com/ChrisTitusTech/winutil"
  weight = 3


[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
