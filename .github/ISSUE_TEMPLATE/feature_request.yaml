name: 功能与同步建议
description: 提出中文版功能、翻译或上游版本同步需求。
labels: [enhancement]
body:
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景与现有问题
      placeholder: 你希望完成什么？当前在哪一步遇到限制？
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 建议的改进
      placeholder: 如涉及上游更新，请附版本号或对应提交、PR 链接。
    validations:
      required: true
