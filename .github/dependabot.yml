version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "actions/stale"
        versions: '>= 9'
  - package-ecosystem: "npm"
    directory: "/mcp"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      mcp-runtime:
        patterns:
          - "@modelcontextprotocol/sdk"
          - "zod"
