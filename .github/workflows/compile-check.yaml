name: Compile & Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  Compile-and-Check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build Chinese script
        shell: pwsh
        run: ./汉化/run-all.ps1
      - name: Check Windows PowerShell 5.1 compatibility
        shell: powershell
        run: ./tools/Test-Build.ps1
      - name: Check PowerShell 7 compatibility
        shell: pwsh
        run: ./tools/Test-Build.ps1
      - name: Upload validated script
        uses: actions/upload-artifact@v7
        with:
          name: winutil-cn-checked
          path: winutil.ps1
          if-no-files-found: error
