name: 构建 MCP 发布包（npm 可选）

# 单独发布 MCP 包，不触发桌面 PS1/EXE 发布。
# 使用 npm Trusted Publisher 的短期 OIDC 凭据，不读取 NPM_TOKEN。
# npm 端必须授权本仓库 publish-mcp.yaml 直接发布；此处不更改账号设置。
on:
  push:
    tags: ['mcp-v*']
  workflow_dispatch:
    inputs:
      version:
        description: '待发布版本，必须等于 package.json / package-lock.json；留空使用现有版本'
        type: string
        required: false
      publish_npm:
        description: '同时发布 npm（仅在所有者已完成 npm 授权后勾选）'
        type: boolean
        default: false
        required: false
      existing_run_id:
        description: '可选：复用成功的同版本标签构建 run ID，上传原包，不重新打包'
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: publish-mcp
  cancel-in-progress: false

jobs:
  tests:
    if: ${{ !inputs.existing_run_id }}
    uses: ./.github/workflows/mcp-tests.yaml
    permissions:
      contents: read

  integration:
    if: ${{ !inputs.existing_run_id }}
    uses: ./.github/workflows/mcp-integration.yaml
    permissions:
      contents: read

  package:
    name: Verify version and package once
    if: ${{ !inputs.existing_run_id }}
    needs: [tests, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
      source_commit: ${{ github.sha }}
      source_run_id: ${{ github.run_id }}
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - name: Verify release ref and committed versions
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          git merge-base --is-ancestor HEAD origin/main
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const version = pkg.version;
          assert.match(version, /^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/);
          assert.equal(pkg.name, 'winutil-cn-mcp');
          assert.equal(lock.version, version, 'lockfile top-level version differs');
          assert.equal(lock.packages?.['']?.version, version, 'lockfile root version differs');
          const ref = process.env.GITHUB_REF;
          const tag = `refs/tags/mcp-v${version}`;
          if (process.env.GITHUB_EVENT_NAME === 'push') {
            assert.equal(ref, tag, 'tag must match the committed package version');
          } else {
            assert.ok(ref === 'refs/heads/main' || ref === tag, 'manual releases must use main or the matching version tag');
          }
          if (process.env.REQUESTED_VERSION) assert.equal(process.env.REQUESTED_VERSION, version, 'requested version differs');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`);
          NODE
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Build the release tarball once
        env:
          WINUTIL_MCP_REQUIRE_CLEAN: '1'
        run: |
          mkdir -p "$RUNNER_TEMP/mcp-package"
          npm pack --json --offline --pack-destination "$RUNNER_TEMP/mcp-package" > "$RUNNER_TEMP/mcp-package/pack.json"
      - name: Verify that exact tarball offline
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: npm run test:pack -- --tarball "$RUNNER_TEMP/mcp-package/winutil-cn-mcp-$PACKAGE_VERSION.tgz"
      - name: Record tarball hash and source
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import { createHash } from 'node:crypto';
          const version = process.env.PACKAGE_VERSION;
          const filename = `winutil-cn-mcp-${version}.tgz`;
          const directory = path.join(process.env.RUNNER_TEMP, 'mcp-package');
          const bytes = fs.readFileSync(path.join(directory, filename));
          const sha256 = createHash('sha256').update(bytes).digest('hex');
          const integrity = 'sha512-' + createHash('sha512').update(bytes).digest('base64');
          const evidence = {
            package: 'winutil-cn-mcp', version, filename, sha256, integrity,
            sourceCommit: process.env.GITHUB_SHA, sourceRef: process.env.GITHUB_REF,
            runId: process.env.GITHUB_RUN_ID, node: process.version,
            verification: 'Windows Node 22/24 and Linux Node 24 regression; exact tarball offline stdio',
          };
          fs.writeFileSync(path.join(directory, 'release-evidence.json'), JSON.stringify(evidence, null, 2) + '\n');
          fs.writeFileSync(path.join(directory, 'SHA256SUMS.txt'), `${sha256}  ${filename}\n`);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `MCP ${version}\n\nSource: ${evidence.sourceCommit}\n\nSHA256: ${sha256}\n`);
          NODE
      - name: Retain the tested package and evidence
        uses: actions/upload-artifact@v7
        with:
          name: mcp-npm-release
          path: ${{ runner.temp }}/mcp-package/
          if-no-files-found: error
          retention-days: 90

  reuse:
    name: Verify and reuse a released tarball
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.existing_run_id }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.source.outputs.version }}
      source_commit: ${{ steps.source.outputs.source_commit }}
      source_run_id: ${{ inputs.existing_run_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Resolve and validate the original version tag
        id: source
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          EXISTING_RUN_ID: ${{ inputs.existing_run_id }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          assert.match(process.env.EXISTING_RUN_ID, /^[1-9]\d*$/);
          const pkg = JSON.parse(fs.readFileSync('mcp/package.json', 'utf8'));
          const version = process.env.REQUESTED_VERSION || pkg.version;
          assert.match(version, /^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/);
          assert.equal(pkg.name, 'winutil-cn-mcp');
          assert.equal(version, pkg.version, 'reuse must match the checked-out package version');
          const tag = `refs/tags/mcp-v${version}`;
          assert.ok(['refs/heads/main', tag].includes(process.env.GITHUB_REF), 'only main or the version tag can publish');
          const source = execFileSync('git', ['rev-parse', `${tag}^{commit}`], { encoding: 'utf8' }).trim();
          assert.match(source, /^[0-9a-f]{40}$/);
          execFileSync('git', ['merge-base', '--is-ancestor', source, 'origin/main']);
          const original = JSON.parse(execFileSync('git', ['show', `${source}:mcp/package.json`], { encoding: 'utf8' }));
          assert.equal(original.name, pkg.name);
          assert.equal(original.version, version);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\nsource_commit=${source}\n`);
          NODE
      - name: Verify the original successful build
        env:
          GH_TOKEN: ${{ github.token }}
          EXISTING_RUN_ID: ${{ inputs.existing_run_id }}
          PACKAGE_VERSION: ${{ steps.source.outputs.version }}
          PACKAGE_SOURCE_COMMIT: ${{ steps.source.outputs.source_commit }}
          PACKAGE_RUN_ID: ${{ inputs.existing_run_id }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$EXISTING_RUN_ID" > "$RUNNER_TEMP/build-run.json"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { verifyBuildRun } from './mcp/release/verify-artifact.mjs';
          verifyBuildRun(JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/build-run.json`, 'utf8')), {
            runId: process.env.PACKAGE_RUN_ID, repository: process.env.GITHUB_REPOSITORY,
            version: process.env.PACKAGE_VERSION, sourceCommit: process.env.PACKAGE_SOURCE_COMMIT,
          });
          NODE
      - uses: actions/download-artifact@v8
        with:
          name: mcp-npm-release
          path: ${{ runner.temp }}/mcp-package
          github-token: ${{ github.token }}
          run-id: ${{ inputs.existing_run_id }}
      - name: Verify the original artifact and offline entry
        env:
          PACKAGE_VERSION: ${{ steps.source.outputs.version }}
          PACKAGE_SOURCE_COMMIT: ${{ steps.source.outputs.source_commit }}
          PACKAGE_RUN_ID: ${{ inputs.existing_run_id }}
          EXISTING_RUN_ID: ${{ inputs.existing_run_id }}
          BUILD_RUN_FILE: ${{ runner.temp }}/build-run.json
        run: |
          node mcp/release/verify-artifact.mjs "$RUNNER_TEMP/mcp-package"
          npm ci --ignore-scripts --prefix mcp
          npm --prefix mcp run test:pack -- --tarball "$RUNNER_TEMP/mcp-package/winutil-cn-mcp-$PACKAGE_VERSION.tgz"
      - uses: actions/upload-artifact@v7
        with:
          name: mcp-npm-release
          path: ${{ runner.temp }}/mcp-package/
          if-no-files-found: error
          retention-days: 90

  publish:
    name: Publish tested tarball
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.publish_npm && (needs.package.result == 'success' || needs.reuse.result == 'success') }}
    needs: [package, reuse]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - uses: actions/download-artifact@v8
        with:
          name: mcp-npm-release
          path: package
      - name: Verify downloaded package identity and hashes
        id: evidence
        env:
          PACKAGE_VERSION: ${{ needs.reuse.outputs.version || needs.package.outputs.version }}
          PACKAGE_SOURCE_COMMIT: ${{ needs.reuse.outputs.source_commit || needs.package.outputs.source_commit }}
          PACKAGE_RUN_ID: ${{ needs.reuse.outputs.source_run_id || needs.package.outputs.source_run_id }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { verifyArtifact } from './mcp/release/verify-artifact.mjs';
          const evidence = await verifyArtifact('package', {
            version: process.env.PACKAGE_VERSION, sourceCommit: process.env.PACKAGE_SOURCE_COMMIT,
            runId: process.env.PACKAGE_RUN_ID,
          });
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `filename=${evidence.filename}\n`);
          NODE
      - name: Check whether this exact package is already published
        id: registry
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import { spawnSync } from 'node:child_process';
          const evidence = JSON.parse(fs.readFileSync('package/release-evidence.json', 'utf8'));
          const result = spawnSync('npm', ['view', `${evidence.package}@${evidence.version}`, 'dist', '--json'], { encoding: 'utf8', timeout: 60000 });
          if (result.error) throw result.error;
          let data;
          try { data = JSON.parse(result.stdout); } catch { throw new Error('npm registry response was not valid JSON; publication was not attempted'); }
          if (result.status === 0) {
            assert.equal(data.integrity, evidence.integrity, 'this version already exists with different content; choose a new committed version');
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'exists=true\n');
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, '同版本及相同 integrity 已存在，跳过重复发布并继续验证。\n');
          } else {
            assert.equal(data.error?.code, 'E404', 'registry lookup failed; publication was not attempted');
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'exists=false\n');
          }
          NODE
      - name: Publish without rebuilding
        if: steps.registry.outputs.exists == 'false'
        env:
          PACKAGE_FILENAME: ${{ steps.evidence.outputs.filename }}
        run: |
          node -e "const v=require('node:child_process').execFileSync('npm',['--version'],{encoding:'utf8'}).trim().split('.').map(Number);if(v[0]<11||(v[0]===11&&(v[1]<5||(v[1]===5&&v[2]<1))))throw new Error('Trusted publishing requires npm >=11.5.1')"
          npm publish "./package/$PACKAGE_FILENAME" --ignore-scripts --provenance --access public
      - name: Verify registry integrity
        env:
          PACKAGE_VERSION: ${{ needs.reuse.outputs.version || needs.package.outputs.version }}
        run: |
          npm view "winutil-cn-mcp@$PACKAGE_VERSION" dist --json > package/registry-dist.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const evidence = JSON.parse(fs.readFileSync('package/release-evidence.json', 'utf8'));
          const dist = JSON.parse(fs.readFileSync('package/registry-dist.json', 'utf8'));
          assert.equal(dist.integrity, evidence.integrity, 'registry package differs from tested tarball');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            `已发布 [winutil-cn-mcp@${evidence.version}](https://www.npmjs.com/package/winutil-cn-mcp/v/${evidence.version})，registry SHA512 与已测试包一致。\n\nSHA256: ${evidence.sha256}\n`);
          NODE
      - name: Retain registry verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mcp-npm-registry-verification
          path: |
            package/release-evidence.json
            package/SHA256SUMS.txt
            package/registry-dist.json
          if-no-files-found: error
          retention-days: 90
