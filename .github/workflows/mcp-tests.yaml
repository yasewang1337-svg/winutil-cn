name: MCP Tests

on:
  push:
    branches: [main]
    paths: ['mcp/**', 'config/applications.json', 'config/bundles.json', 'config/tweaks.json', 'config/dns.json', '汉化/extra-apps.json', '.github/workflows/mcp-tests.yaml', '.github/workflows/publish-mcp.yaml']
  pull_request:
    branches: [main]
    paths: ['mcp/**', 'config/applications.json', 'config/bundles.json', 'config/tweaks.json', 'config/dns.json', '汉化/extra-apps.json', '.github/workflows/mcp-tests.yaml', '.github/workflows/publish-mcp.yaml']
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: MCP (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            node: '22'
            powershell: powershell.exe
          - os: windows-latest
            node: '24'
            powershell: pwsh.exe
          - os: ubuntu-latest
            node: '24'
            powershell: ''
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: MCP protocol and executor fixture regression
        env:
          WINUTIL_MCP_TEST_POWERSHELL: ${{ matrix.powershell }}
        run: npm test
      - name: Clean package and offline stdio verification
        run: npm run test:pack
