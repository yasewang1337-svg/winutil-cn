name: 构建并发布中文版

# 汉化构建流水线：跑 汉化/run-all.ps1 产出 winutil-cn.ps1，发到 Release。
# 触发后，一键命令即可用：
#   irm https://github.com/<owner>/<repo>/releases/latest/download/winutil-cn.ps1 | iex

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'config/**'
      - 'functions/**'
      - 'xaml/**'
      - 'scripts/**'
      - 'Compile.ps1'
      - '汉化/**'
      - 'tools/launcher/**'
      - '.github/workflows/release-cn.yaml'

permissions:
  contents: write

concurrency:
  group: release-cn
  cancel-in-progress: false

jobs:
  tests:
    uses: ./.github/workflows/unittests.yaml
    permissions:
      contents: read

  build-release:
    needs: tests
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v7

      - name: 汉化 + 编译
        shell: pwsh
        run: |
          & "./汉化/run-all.ps1"
          if (-not (Test-Path winutil.ps1)) { throw "构建失败：未生成 winutil.ps1" }
          Copy-Item winutil.ps1 winutil-cn.ps1 -Force
          $size = (Get-Item winutil-cn.ps1).Length
          Write-Host "产出 winutil-cn.ps1 —— $size 字节"
          if ($size -lt 500000) { throw "产物过小（$size 字节），疑似构建不完整" }

      - name: 验证 PowerShell 5.1 产物
        shell: powershell
        run: ./tools/Test-Build.ps1 -Path ./winutil-cn.ps1

      - name: 验证 PowerShell 7 产物
        shell: pwsh
        run: ./tools/Test-Build.ps1 -Path ./winutil-cn.ps1

      - name: 构建自包含 EXE 启动器
        shell: pwsh
        run: |
          # 版本号与发布号联动(年.月.日.构建号),写进 EXE 元数据
          $exeVer = "$(Get-Date -Format 'yyyy.M.d').${{ github.run_number }}"
          & "./tools/launcher/build.ps1" -ScriptPath "winutil-cn.ps1" -OutFile "WinUtil-CN.exe" -Version $exeVer
          if (-not (Test-Path WinUtil-CN.exe)) { throw "EXE 构建失败" }

      - name: Defender 自检（仅在检出真实威胁时中断）
        id: defender
        shell: pwsh
        run: |
          $exe = (Resolve-Path WinUtil-CN.exe).Path
          $status = Get-MpComputerStatus -ErrorAction SilentlyContinue
          Write-Host "Defender 实时防护: $($status.RealTimeProtectionEnabled)"

          $mp = Get-ChildItem "$env:ProgramData\Microsoft\Windows Defender\Platform\*\MpCmdRun.exe" -ErrorAction SilentlyContinue |
                Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $mp) { $mp = Get-Item "$env:ProgramFiles\Windows Defender\MpCmdRun.exe" -ErrorAction SilentlyContinue }

          $scanText = ''
          $scanClean = $false
          if ($mp) {
            $scanText = (& $mp.FullName -Scan -ScanType 3 -File $exe -DisableRemediation 2>&1 | Out-String)
            Write-Host $scanText
            Write-Host "MpCmdRun 退出码: $LASTEXITCODE"
            # 扫描真正跑完的标志（区别于服务不可用报错 0x800106ba / 0x80004005）
            $scanClean = ($scanText -match 'found no threats')
          } else {
            Write-Warning "未找到 MpCmdRun"
          }

          # 真实威胁判定：扫描输出报威胁，或威胁历史里出现本文件
          $threat = ($scanText -match 'Threat\s+' -or $scanText -match 'found \d+ threat')
          $hit = Get-MpThreatDetection -ErrorAction SilentlyContinue | Where-Object { $_.Resources -match 'WinUtil-CN' }
          if ($hit) { $hit | Format-List; $threat = $true }

          Write-Host "SHA256: $((Get-FileHash $exe -Algorithm SHA256).Hash)"

          if ($threat) {
            Write-Error "❌ Defender 检出威胁，中断发布——请勿分发被标记的产物。"
            exit 1
          }
          if ($scanClean) {
            Write-Host "✅ Defender 扫描完成，未检出威胁。"
            "status=扫描完成，未检出威胁" >> $env:GITHUB_OUTPUT
          } else {
            Write-Warning "本 runner 未完成 Defender 扫描，发布说明将如实标注。"
            "status=未完成扫描（runner 扫描器不可用）" >> $env:GITHUB_OUTPUT
          }
          exit 0

      - name: 生成版本号
        id: ver
        shell: pwsh
        run: |
          $tag = "cn-$(Get-Date -Format 'yyyy.MM.dd')-${{ github.run_number }}"
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "版本标签：$tag"

      - name: 撰写发布说明
        shell: pwsh
        run: |
          $repo = "${{ github.repository }}"
          $sha  = "${{ github.sha }}"
          $tag  = "${{ steps.ver.outputs.tag }}"
          $exeSha = (Get-FileHash WinUtil-CN.exe -Algorithm SHA256).Hash
          $scriptSha = (Get-FileHash winutil-cn.ps1 -Algorithm SHA256).Hash
          @("$scriptSha  winutil-cn.ps1", "$exeSha  WinUtil-CN.exe") | Set-Content SHA256SUMS.txt -Encoding ascii
          $notes = @"
          WinUtil CN 中文装机与维护助手 · 自动构建（$tag）

          ## 三步开始

          1. 下载下方附件 WinUtil-CN.exe。
          2. 双击打开，按 Windows 提示授予管理员权限，从首页选择用途。
          3. 调整软件或设置清单，查看范围后确认执行，完成后检查结果。

          EXE 内嵌本版本脚本，使用 Windows 自带 PowerShell 5.1。首次准备包管理器、下载安装软件和更新仍需要联网；单文件启动不等于离线安装所有软件。

          ## 本版使用体验

          - 首页提供装机、软件管理、基础设置、清单导入导出与设置历史入口
          - 组合先预览用途和候选，再按需加入清单；确认组合不会立即安装
          - 安装或卸载所选软件先核对计划，完成后逐项报告状态、原因与日志，可仅重试失败项
          - 全部升级入口先说明整批范围，范围不限当前勾选；只提供整批结果与日志
          - 基础和标准方案不含批量卸载应用或禁用服务；修改设置前展示影响和恢复范围
          - 有记录的注册表值和服务启动配置可按历史恢复；无记录的旧改动、已删除应用、清理文件及脚本其他效果不能完整恢复

          [中文上手指南](https://github.com/$repo/blob/$sha/docs/content/userguide/getting-started/_index.md) · [软件组合说明](https://github.com/$repo/blob/$sha/docs/content/userguide/recommendations/_index.md)

          ## PowerShell 入口

          习惯命令行的用户可在管理员 PowerShell 中运行最新版中文脚本，或下载下方 winutil-cn.ps1：

              irm https://github.com/$repo/releases/latest/download/winutil-cn.ps1 | iex

          ## 说明

          - 基于本仓库提交 $sha 与汉化层构建；上游同步进度见仓库维护文档
          - winutil-cn.ps1 为 UTF-8 with BOM，兼容 PowerShell 5.1 中文显示
          - 中文维护：Holha1337；基于 Chris Titus Tech Windows Utility，沿用 MIT 许可
          - Defender：${{ steps.defender.outputs.status }}
          - PowerShell 5.1 / 7 回归测试、产物语法和编码检查通过
          - EXE 未做代码签名；校验文件见 SHA256SUMS.txt，也可按哈希查看 [VirusTotal](https://www.virustotal.com/gui/search/$exeSha) 是否已有检测记录
          - EXE SHA256：``$exeSha``
          - 构建自提交 $sha
          "@
          Set-Content -Path notes.md -Value $notes -Encoding utf8

      - name: 发布 Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.ver.outputs.tag }}" winutil-cn.ps1 WinUtil-CN.exe SHA256SUMS.txt `
            --target "${{ github.sha }}" `
            --title "中文版 ${{ steps.ver.outputs.tag }}" `
            --notes-file notes.md `
            --latest
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release 发布失败' }
