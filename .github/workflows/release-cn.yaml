name: 构建并发布中文版

# 汉化构建流水线：跑 汉化/run-all.ps1 产出 winutil-cn.ps1，发到 Release。
# Release 同时提供脚本、启动器、SHA256 与逐文件扫描证据。

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'config/**'
      - 'functions/**'
      - 'xaml/**'
      - 'scripts/**'
      - 'Compile.ps1'
      - '汉化/**'
      - 'tools/launcher/**'
      - 'tools/autounattend.xml'
      - 'tools/Sync-VerifiedToolTemplate.ps1'
      - 'tools/Test-ReleaseSecurity.ps1'
      - 'pester/release-security.Tests.ps1'
      - '.github/workflows/release-cn.yaml'

permissions:
  contents: write

concurrency:
  group: release-cn
  cancel-in-progress: false

jobs:
  tests:
    uses: ./.github/workflows/unittests.yaml
    permissions:
      contents: read

  build-release:
    needs: tests
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v7

      - name: 汉化 + 编译
        shell: pwsh
        run: |
          & "./汉化/run-all.ps1"
          if (-not (Test-Path winutil.ps1)) { throw "构建失败：未生成 winutil.ps1" }
          Copy-Item winutil.ps1 winutil-cn.ps1 -Force
          $size = (Get-Item winutil-cn.ps1).Length
          Write-Host "产出 winutil-cn.ps1 —— $size 字节"
          if ($size -lt 500000) { throw "产物过小（$size 字节），疑似构建不完整" }

      - name: 验证 PowerShell 5.1 产物
        shell: powershell
        run: ./tools/Test-Build.ps1 -Path ./winutil-cn.ps1

      - name: 验证 PowerShell 7 产物
        shell: pwsh
        run: ./tools/Test-Build.ps1 -Path ./winutil-cn.ps1

      - name: 构建自包含 EXE 启动器
        shell: pwsh
        run: |
          # 版本号与发布号联动(年.月.日.构建号),写进 EXE 元数据
          $exeVer = "$(Get-Date -Format 'yyyy.M.d').${{ github.run_number }}"
          & "./tools/launcher/build.ps1" -ScriptPath "winutil-cn.ps1" -OutFile "WinUtil-CN.exe" -Version $exeVer
          if (-not (Test-Path WinUtil-CN.exe)) { throw "EXE 构建失败" }

      - name: Defender 扫描全部发布产物（未完成扫描则阻止发布）
        id: defender
        timeout-minutes: 10
        shell: pwsh
        run: |
          ./tools/Test-ReleaseSecurity.ps1 -Path ./winutil-cn.ps1, ./WinUtil-CN.exe -ReportPath ./security-scan.json
          "status=PS1 与 EXE 均完成扫描，未检出威胁" >> $env:GITHUB_OUTPUT

      - name: 保存 Defender 诊断证据（包含失败结果）
        if: always() && steps.defender.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          name: release-security-${{ github.run_id }}
          path: security-scan.json
          if-no-files-found: warn

      - name: 生成版本号
        id: ver
        shell: pwsh
        run: |
          $tag = "cn-$(Get-Date -Format 'yyyy.MM.dd')-${{ github.run_number }}"
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "版本标签：$tag"

      - name: 撰写发布说明
        shell: pwsh
        run: |
          $repo = "${{ github.repository }}"
          $sha  = "${{ github.sha }}"
          $tag  = "${{ steps.ver.outputs.tag }}"
          $exeSha = (Get-FileHash WinUtil-CN.exe -Algorithm SHA256).Hash
          $scriptSha = (Get-FileHash winutil-cn.ps1 -Algorithm SHA256).Hash
          $reportSha = (Get-FileHash security-scan.json -Algorithm SHA256).Hash
          $security = Get-Content security-scan.json -Raw -Encoding UTF8 | ConvertFrom-Json
          $signatureSummary = ($security.Files | ForEach-Object { "$($_.Name): $($_.AuthenticodeStatus)" }) -join '; '
          @("$scriptSha  winutil-cn.ps1", "$exeSha  WinUtil-CN.exe", "$reportSha  security-scan.json") | Set-Content SHA256SUMS.txt -Encoding ascii
          $notes = @"
          WinUtil CN 中文装机与维护助手 · 自动构建（$tag）

          ## 三步开始

          1. 下载下方附件 WinUtil-CN.exe。
          2. 双击打开，按 Windows 提示授予管理员权限，从首页选择用途。
          3. 调整软件或设置清单，查看范围后确认执行，完成后检查结果。

          EXE 内嵌本版本脚本，使用 Windows 自带 PowerShell 5.1。首次准备包管理器、下载安装软件和更新仍需要联网；单文件启动不等于离线安装所有软件。

          ## 本版使用体验

          - 第三方工具下载后先校验：O&O 验证签名及发布者，ViVeTool 验证固定版本哈希；失败会停止并明确报告
          - 工具使用独立受保护目录，执行期间防止文件被替换；无人值守安装使用同一校验逻辑
          - 启动与提权改用本地文件和系统 PowerShell，保留 Defender 自动样本提交设置；缺失 Chocolatey 改为手动安装指引

          - 首页提供装机、软件管理、基础设置、清单导入导出与设置历史入口
          - 组合先预览用途和候选，再按需加入清单；确认组合不会立即安装
          - 安装或卸载所选软件先核对计划，完成后逐项报告状态、原因与日志，可仅重试失败项
          - 全部升级入口先说明整批范围，范围不限当前勾选；只提供整批结果与日志
          - 基础和标准方案不含批量卸载应用或禁用服务；修改设置前展示影响和恢复范围
          - 有记录的注册表值和服务启动配置可按历史恢复；无记录的旧改动、已删除应用、清理文件及脚本其他效果不能完整恢复

          [中文上手指南](https://github.com/$repo/blob/$sha/docs/content/userguide/getting-started/_index.md) · [软件组合说明](https://github.com/$repo/blob/$sha/docs/content/userguide/recommendations/_index.md)

          ## PowerShell 入口

          从本次 Release 下载 winutil-cn.ps1 和 SHA256SUMS.txt，放在同一文件夹。打开该文件夹的 PowerShell，先核对哈希：

              Get-FileHash .\winutil-cn.ps1 -Algorithm SHA256
              Get-Content .\SHA256SUMS.txt

          确认输出与清单中 winutil-cn.ps1 对应的 SHA256 完全一致后，在该文件夹的管理员 PowerShell 中运行：

              & .\winutil-cn.ps1

          若执行策略或安全软件阻止运行，请先核对来源并查阅仓库说明；不要绕过拦截。

          ## 说明

          - 基于本仓库提交 $sha 与汉化层构建；上游同步进度见仓库维护文档
          - winutil-cn.ps1 为 UTF-8 with BOM，兼容 PowerShell 5.1 中文显示
          - 中文维护：Holha1337；基于 Chris Titus Tech Windows Utility，沿用 MIT 许可
          - Defender：${{ steps.defender.outputs.status }}
          - PowerShell 5.1 / 7 回归测试、产物语法和编码检查通过
          - 签名检查：$signatureSummary（NotSigned 表示未签名）；校验文件见 SHA256SUMS.txt
          - 逐文件哈希、实际签名状态、Defender 引擎/病毒库版本、原始扫描输出见 security-scan.json；扫描通过不能保证其他厂商或未来版本不再告警
          - 火绒构建拦截尚未确认解决；已知记录与整改范围见[安全告警复核](https://github.com/$repo/blob/$sha/docs/HUORONG-REVIEW.md)，不能将本次 Defender 结果视为火绒已放行
          - 若被安全软件拦截，请先保留告警名称与文件 SHA256，核对版本并向维护者及检测厂商报告；不要关闭防护或添加排除
          - 可按哈希查看 [VirusTotal](https://www.virustotal.com/gui/search/$exeSha) 是否已有检测记录
          - EXE SHA256：``$exeSha``
          - 构建自提交 $sha
          "@
          Set-Content -Path notes.md -Value $notes -Encoding utf8

      - name: 发布 Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./tools/Test-ReleaseSecurity.ps1 -Path ./winutil-cn.ps1, ./WinUtil-CN.exe -ReportPath ./security-scan.json -VerifyOnly
          # Verify every checksum immediately before attaching files to the release.
          foreach ($line in Get-Content SHA256SUMS.txt) {
            if ($line -notmatch '^([A-Fa-f0-9]{64})  (.+)$') { throw 'Invalid SHA256SUMS.txt entry' }
            if ((Get-FileHash -LiteralPath $Matches[2] -Algorithm SHA256).Hash -ne $Matches[1]) { throw "Release checksum changed: $($Matches[2])" }
          }
          gh release create "${{ steps.ver.outputs.tag }}" winutil-cn.ps1 WinUtil-CN.exe SHA256SUMS.txt security-scan.json `
            --target "${{ github.sha }}" `
            --title "中文版 ${{ steps.ver.outputs.tag }}" `
            --notes-file notes.md `
            --latest
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release 发布失败' }
