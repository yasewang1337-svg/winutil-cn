name: 检查生成产物未入库

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check-generated-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Reject tracked build outputs
        shell: bash
        run: |
          tracked=$(git ls-files -- winutil.ps1 winutil-cn.ps1 WinUtil-CN.exe mcp/data.json .artifacts tools/launcher/bin tools/launcher/obj)
          if [ -n "$tracked" ]; then
            printf '%s\n' "$tracked"
            echo '::error::Build outputs must stay untracked. Remove them from the Git index and commit the source files instead.'
            exit 1
          fi
