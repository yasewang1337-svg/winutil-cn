name: 中文文档网站

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "tools/check_docs_site.py"
      - "tools/test_docs_site.py"
      - ".github/workflows/docs.yaml"
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - "tools/check_docs_site.py"
      - "tools/test_docs_site.py"
      - ".github/workflows/docs.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  HUGO_VERSION: 0.156.0
  HUGO_ENVIRONMENT: production
  SITE_URL: https://yasewang1337-svg.github.io/winutil-cn/
  TZ: Asia/Taipei

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build and check Chinese docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go for the pinned Hugo module
        uses: actions/setup-go@v7
        with:
          go-version-file: docs/go.mod
          cache: true
          cache-dependency-path: docs/go.sum
      - name: Install pinned Hugo with release checksum verification
        run: |
          archive="hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          release="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}"
          curl --fail --silent --show-error --location --retry 3 "$release/$archive" --output "$RUNNER_TEMP/$archive"
          curl --fail --silent --show-error --location --retry 3 "$release/hugo_${HUGO_VERSION}_checksums.txt" --output "$RUNNER_TEMP/hugo-checksums.txt"
          cd "$RUNNER_TEMP"
          awk -v archive="$archive" '$2 == archive { print; found = 1 } END { if (!found) exit 1 }' hugo-checksums.txt > hugo-expected.sha256
          sha256sum --check hugo-expected.sha256
          mkdir -p "$RUNNER_TEMP/hugo-bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/hugo-bin" hugo
          echo "$RUNNER_TEMP/hugo-bin" >> "$GITHUB_PATH"
      - name: Test the site validation gate
        run: python3 -m unittest discover -s tools -p test_docs_site.py -v
      - name: Build the project-path website
        run: |
          hugo --gc --minify --source docs \
            --destination "$GITHUB_WORKSPACE/.artifacts/docs-site" \
            --baseURL "$SITE_URL" --cacheDir "$RUNNER_TEMP/hugo-cache"
      - name: Validate generated links, assets and search metadata
        run: |
          python3 tools/check_docs_site.py --site .artifacts/docs-site \
            --base-url "$SITE_URL" --report .artifacts/docs-site-validation.json
          git diff --exit-code -- docs
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: chinese-docs-validation
          path: .artifacts/docs-site-validation.json
          include-hidden-files: true
          if-no-files-found: warn
      - name: Upload validated Pages artifact
        if: github.repository == 'yasewang1337-svg/winutil-cn' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: .artifacts/docs-site

  deploy:
    name: Deploy Chinese docs
    if: github.repository == 'yasewang1337-svg/winutil-cn' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check Pages configuration
        uses: actions/configure-pages@v6
      - name: Deploy the validated artifact
        id: deployment
        uses: actions/deploy-pages@v5
